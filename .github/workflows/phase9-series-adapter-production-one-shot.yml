name: Phase 9 Series Adapter Production One-shot

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify-production:
    if: github.head_ref == 'agent/phase9-series-adapter-production-check'
    runs-on: ubuntu-latest
    env:
      SERIES_ORIGIN: https://ai-tools-history-archive.pages.dev
      SERIES_EXPECTED_COMMIT: 76ef103329813f0174db121117c932bff53fbf8e
      SERIES_VERIFY_ATTEMPTS: 20
      SERIES_VERIFY_INTERVAL_MS: 15000
      GITHUB_SHA: 76ef103329813f0174db121117c932bff53fbf8e
    steps:
      - name: Checkout reviewed main plus verifier
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --progress=false
      - name: Generate native and Series machine layers locally
        run: npm run generate:machine
      - name: Validate local Series adapter
        run: npm run validate:series
      - name: Verify complete Series adapter on production
        run: node scripts/check-series-origin.mjs
