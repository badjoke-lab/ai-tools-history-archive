name: Phase 7 Production Verification

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: atha-phase7-production
  cancel-in-progress: true

jobs:
  verify-production:
    runs-on: ubuntu-latest
    env:
      ATHA_PRODUCTION_ORIGIN: https://ai-tools-history-archive.pages.dev
      PHASE7_IMPLEMENTATION_FLOOR: 1850af25d16e842915506b38d568baa45b3eb202
      PHASE7_VERIFY_ATTEMPTS: '20'
      PHASE7_VERIFY_INTERVAL_MS: '15000'
    steps:
      - name: Publish pending production status
        uses: actions/github-script@v7
        with:
          script: |
            const targetUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'atha-phase7-production',
              description: 'Phase 7 reviewed production verification running',
              target_url: targetUrl
            });

      - name: Checkout reviewed main with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify reviewed production
        shell: bash
        run: |
          set -o pipefail
          node scripts/check-phase7-production.mjs 2>&1 | tee phase7-production.log

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atha-phase7-production-${{ github.sha }}
          path: phase7-production.log
          if-no-files-found: warn

      - name: Publish successful production status
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const targetUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'atha-phase7-production',
              description: 'Phase 7 reviewed production verification passed',
              target_url: targetUrl
            });

      - name: Publish failed production status
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const targetUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'failure',
              context: 'atha-phase7-production',
              description: 'Phase 7 reviewed production verification failed',
              target_url: targetUrl
            });
